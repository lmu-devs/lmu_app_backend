services:
    db:
        image: postgres:16.4-bookworm
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        container_name: db
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_PORT: ${POSTGRES_PORT}
            POSTGRES_HOST: ${POSTGRES_HOST}
            PGDATABASE: ${POSTGRES_DB}
        ports:
            - '127.0.0.1:5432:5432'
        restart: always
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
            interval: 2s
            timeout: 2s
            retries: 5
        networks:
            - backend
            - frontend


    api:
        image: ${DOCKER_USERNAME}/lmu-app-backend-api:${ENVIRONMENT}
        build:
            context: .
            dockerfile: docker/Dockerfile-api
            args:
                BUILD_ENV: ${ENVIRONMENT:-development}
                COMMIT_SHA: local
                BUILD_DATE: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
        environment:
            - PYTHONPATH=/app
            - ENVIRONMENT=${ENVIRONMENT:-development}
        env_file:
            - .env
        container_name: api
        networks:
            - backend
            - frontend
            - shared
        ports:
            - '127.0.0.1:8001:8000'
        depends_on:
            db:
                condition: service_healthy
        restart: always

    api_dev:
        extends: api
        container_name: api_dev
        volumes:
            - .:/app

    data_fetcher:
        image: ${DOCKER_USERNAME}/lmu-app-backend-data:${ENVIRONMENT}
        build:
            context: .
            dockerfile: docker/Dockerfile-data_fetcher
            args:
                BUILD_ENV: ${ENVIRONMENT:-development}
                COMMIT_SHA: local
                BUILD_DATE: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
        env_file:
            - .env
        container_name: data_fetcher
        networks:
            - frontend
            - backend
        environment:
            - PYTHONPATH=/app
            - PYTHONUNBUFFERED=1
            - ENVIRONMENT=${ENVIRONMENT:-development}
        depends_on:
            db:
                condition: service_healthy
        restart: on-failure

    data_fetcher_dev:
        extends: data_fetcher
        container_name: data_fetcher_dev
        volumes:
            - .:/app

    nginx:
        container_name: nginx
        image: 'jc21/nginx-proxy-manager:2.12.3'
        restart: unless-stopped
        ports:
            - '80:80' # Public HTTP Port
            - '443:443' # Public HTTPS Port
        volumes:
            - ./nginx/data:/data
            - ./nginx/letsencrypt:/etc/letsencrypt
            - ./nginx/snippets:/snippets:ro
        environment:
            TZ: 'Europe/Berlin'
        networks:
            - frontend
            - shared

volumes:
    postgres_data:
    postgres_metabase_data:

networks:
    backend:
        internal: true
    frontend:
    shared:
        external: true
