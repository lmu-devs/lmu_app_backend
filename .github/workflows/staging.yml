name: Deploy to Staging

on:
    push:
        branches:
            - staging

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        environment: staging
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Cache Docker layers
              uses: actions/cache@v3
              with:
                  path: /tmp/.buildx-cache
                  key: ${{ runner.os }}-buildx-${{ hashFiles('requirements.txt') }}
                  restore-keys: |
                      ${{ runner.os }}-buildx-

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Extract metadata for Docker
              id: meta
              run: |
                  echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
                  echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

            - name: Build and push multi-architecture API image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  file: ./docker/Dockerfile-api
                  platforms: linux/amd64,linux/arm64
                  push: true
                  tags: |
                      ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:staging
                      ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:${{ steps.meta.outputs.commit_sha }}
                  build-args: |
                      BUILD_ENV=staging
                      COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
                      BUILD_DATE=${{ steps.meta.outputs.build_date }}
                  cache-from: type=local,src=/tmp/.buildx-cache
                  cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

            # - name: Build and push multi-architecture data fetcher image
            #   uses: docker/build-push-action@v4
            #   with:
            #       context: .
            #       file: ./docker/Dockerfile-data_fetcher
            #       platforms: linux/amd64,linux/arm64
            #       push: true
            #       tags: |
            #           ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:staging
            #           ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:${{ steps.meta.outputs.commit_sha }}
            #       build-args: |
            #           BUILD_ENV=staging
            #           COMMIT_SHA=${{ steps.meta.outputs.commit_sha }}
            #           BUILD_DATE=${{ steps.meta.outputs.build_date }}
            #       cache-from: type=local,src=/tmp/.buildx-cache
            #       cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add host key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.HOST }} -T 60 >> ~/.ssh/known_hosts || echo "Failed to scan host key"

            - name: Deploy to staging server
              run: |
                  echo "Deploying to staging server..."
                  # Create deployment directory if it doesn't exist
                  ssh ${{ secrets.USER }}@${{ secrets.HOST }} "mkdir -p ${{ secrets.APP_PATH }}"

                  # Copy compose.yml
                  scp compose.yml ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.APP_PATH }}/compose.yml

                  # Deploy using Docker Compose
                  ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && \
                  export ENVIRONMENT=staging && \
                  docker compose pull nginx db api_v1 pgadmin data_fetcher && \
                  docker compose down && \
                  docker compose up -d nginx db api_v1"

            # - name: Run database migrations
            #   run: |
            #       echo "Running database migrations..."
            #       ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && docker exec api_v1 alembic upgrade head"

            - name: Notify deployment success
              if: success()
              run: echo "Deployment to staging successful"
