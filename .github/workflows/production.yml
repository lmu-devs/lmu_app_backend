name: Deploy to Production

on:
    push:
        branches:
            - main
    workflow_dispatch:

jobs:
    deploy-to-production:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Pull and retag Docker api image for production
              run: |
                  # Pull the staging image
                  docker pull ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:staging

                  # Tag it for production
                  docker tag ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:staging ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:production

                  # Push the production tag
                  docker push ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-api:production

            - name: Pull and retag Docker data_fetcher image for production
              run: |
                  # Pull the staging image
                  docker pull ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:staging

                  # Tag it for production
                  docker tag ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:staging ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:production

                  # Push the production tag
                  docker push ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend-data:production

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add host key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to production server
              run: |
                  ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && \
                  git pull origin main && \
                  export ENVIRONMENT=production && \
                  docker compose down && \
                  docker compose up -d"

            # - name: Run database migrations
            #   run: |
            #       ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && docker exec api_v1 alembic upgrade head"

            - name: Notify deployment success
              if: success()
              run: echo "Deployment to production successful"
