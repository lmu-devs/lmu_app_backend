name: Deploy to Production

on:
    push:
        branches:
            - main
    workflow_dispatch:
        inputs:
            commit_sha:
                description: 'Specific commit SHA to deploy (defaults to latest staging commit)'
                required: false
                default: ''

jobs:
    deploy-to-production:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: Get staging commit SHA
              id: get_sha
              run: |
                  if [ -z "${{ github.event.inputs.commit_sha }}" ]; then
                    # Get the latest commit SHA from staging branch
                    git fetch origin staging
                    STAGING_SHA=$(git rev-parse --short origin/staging)
                    echo "::set-output name=commit_sha::${STAGING_SHA}"
                  else
                    echo "::set-output name=commit_sha::${{ github.event.inputs.commit_sha }}"
                  fi

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                  username: ${{ secrets.DOCKER_USERNAME }}
                  password: ${{ secrets.DOCKER_TOKEN }}

            - name: Pull and retag Docker image for production
              run: |
                  COMMIT_SHA=${{ steps.get_sha.outputs.commit_sha }}
                  echo "Deploying commit: ${COMMIT_SHA}"

                  # Pull the image from staging with the specific commit SHA
                  docker pull ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend:${COMMIT_SHA}

                  # Tag it for production
                  docker tag ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend:${COMMIT_SHA} ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend:production

                  # Push the production tag
                  docker push ${{ secrets.DOCKER_USERNAME }}/lmu-app-backend:production

            - name: Set up SSH
              uses: webfactory/ssh-agent@v0.7.0
              with:
                  ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

            - name: Add host key
              run: |
                  mkdir -p ~/.ssh
                  ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

            - name: Deploy to production server
              run: |
                  ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && \
                  git pull origin main && \
                  export ENVIRONMENT=production && \
                  docker compose down && \
                  docker compose up -d"

            - name: Run database migrations
              run: |
                  ssh ${{ secrets.USER }}@${{ secrets.HOST }} "cd ${{ secrets.APP_PATH }} && docker exec api_v1 alembic upgrade head"

            - name: Notify deployment success
              if: success()
              run: echo "Deployment to production successful"
