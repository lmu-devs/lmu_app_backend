query GetBenefits($languageCode: String!) {
    benefit_types(
        sort: ["translations.title"]
        ) {
        id
        emoji
        translations(filter: { languages_code: { code: { _eq: $languageCode } } }) {
            title
            description
        }
    }
    benefits(
        sort: ["translations.title"]
        ) {
        image {
            title
            id
        }
        url
        translations(filter: { languages_code: { code: { _eq: $languageCode } } }) {
            title
            description
        }
        type {
            benefit_types_id {
                id
            }
        }
    }
}
