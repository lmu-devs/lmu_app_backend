mutation UpdateCalendarEvent($id: UUID!, $data: update_calendar_event_input!) {
  update_calendar_event_item(id: $id, data: $data) {
    id
    user_id
    date_created
    date_updated
    title
    description
    address
    all_day
    event_type
    start_time
    end_time
    rule {
      id
      frequency
      interval
      until_time
    }
  }
}