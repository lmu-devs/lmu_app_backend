mutation UpdateCalendarException($id: ID!, $data: update_calendar_exceptions_input!) {
  update_calendar_exceptions_item(id: $id, data: $data) {
    id
    title
    description
    recurrence_id
    start_time
    end_time
    all_day
    overwrite
    location {
      id
      address
      latitude
      longitude
    }
    event {
      id
    }
  }
}