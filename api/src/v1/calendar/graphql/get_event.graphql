query GetCalendarEvents($filter: calendar_event_filter) {
  calendar_event(filter: $filter) {
    id
    user_id
    date_created
    date_updated
    title
    description
    all_day
    event_type
    start_time
    end_time
    access_scope
    rule {
      id
      frequency
      interval
      until_time
    }
    location {
      address
      latitude
      longitude
    }
    exceptions {
      id
      title
      description
      recurrence_id
      start_time
      end_time
      all_day
      location {
        id
        address
        latitude
        longitude
      }
    }
  }
}