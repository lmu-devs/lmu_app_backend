mutation CreateCalendarEvent($data: create_calendar_event_input!) {
  create_calendar_event_item(data: $data) {
    id
    user_id
    date_created
    date_updated
    title
    description
    all_day
    event_type
    start_time
    end_time
    access_scope
    rule {
      id
      frequency
      interval
      until_time
    }
    location {
      address
      latitude
      longitude
    }
    online_link
  }
}