query clubs($languageCode: String!) {
    student_clubs(sort: ["translations.title"], filter: { is_shown: { _eq: true } }) {
        id
        univerities {
            id
        }
        type
        image: logo {
            title
            id
        }
        url
        email
        instagram_url
        linkedin_url
        category
        founding_year
        location {
            address
            latitude
            longitude
        }
        translations(filter: { languages_code: { code: { _eq: $languageCode } } }) {
            title
            description
            content
        }
    }
}
